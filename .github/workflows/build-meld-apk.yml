name: Build Meld APK

on:
  push:
    paths:
      - '.github/workflows/build-meld-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Check out Meld source
        uses: actions/checkout@v4
        with:
          repository: FrancescoGrazioso/Meld
          ref: main
          path: source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: source
        env:
          METROLIST_APPLICATION_ID: com.meld.app
          METROLIST_APP_NAME: Meld
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meld-Android-APK
          path: source/app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
