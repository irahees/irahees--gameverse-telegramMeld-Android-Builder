name: Build Meld APK

on:
  push:
    paths:
      - '.github/workflows/build-meld-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Check out Meld source
        uses: actions/checkout@v4
        with:
          repository: FrancescoGrazioso/Meld
          ref: main
          path: source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Configure API 37 minor level
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = "    compileSdk = 37"
          new = """    compileSdk {
                  version = release(37) {
                      minorApiLevel = 0
                  }
              }"""
          if old not in s:
              raise SystemExit("Expected compileSdk = 37 declaration was not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Generate CI debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        working-directory: source
        env:
          METROLIST_APPLICATION_ID: com.meld.app
          METROLIST_APP_NAME: Meld
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meld-Android-APK
          path: source/app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
